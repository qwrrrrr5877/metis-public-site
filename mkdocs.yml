site_name: Metis Forecasting System
site_description: Public notes on the Metis multi-engine forecasting framework.
site_url: https://qwrrrrr5877.github.io/metis-public-site/
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: black
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Principles: principles.md
  - Learning: learning.md
  - Engines:
      - Overview: engines/index.md
      - FOMC: engines/fomc.md
      - AI_CAP: engines/ai-cap.md
      - ODAC: engines/odac.md
      - IDN_NI: engines/idn-ni.md
  - Portfolio: dashboard/portfolio.md
  - Framework:
      - Core Overview: metis/core-overview.md
      - Patterns:
          - Overview: metis/patterns/index.md
          - Pre-Event Freeze: metis/patterns/pre-event-freeze.md
          - Candidate Registration Gate: metis/patterns/candidate-registration-gate.md
          - History Compression Review: metis/patterns/history-compression-review.md
          - Failure Mode Taxonomy: metis/patterns/failure-mode-taxonomy.md
  - Reports:
      - Index: reports/index.md
      - Weekly 2026-W18: reports/weekly/2026-W18.md
      - Build Log 2026-04-28: reports/build-log/2026-04-28.md
      - Recent FOMC Report: reports/fomc/recent-fomc-report.md







